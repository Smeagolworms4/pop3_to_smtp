name: 'tests'

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # L'image tourne sur Node 22 ; on vérifie aussi la LTS suivante pour voir
      # venir les ruptures avant qu'elles n'arrivent en production.
      matrix:
        node: [ '22', '24' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
